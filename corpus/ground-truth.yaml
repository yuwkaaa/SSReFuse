# SSReFuse ground truth.
#
# label semantics
#   vulnerable : at least one attacker-supplied input makes the application send
#                a request to an internal target (the admin service, the fake
#                metadata address, the CGNAT service) or read a local file.
#   safe       : no such input exists. These rows are the false-positive control
#                set, so each one needs a reason recorded in `why_safe`.
#
# The labels here are a claim about the application. The claim that a *specific
# bypass family* works is never written here: the harness measures that and the
# evaluator compares its measurement against `bypasses_declared`. A mismatch is
# a defect in the lab or in the catalog, and the report prints it either way.
#
# A variant whose sink lives in a helper declares `uses_shared`, naming a region
# marked the same way in the source. A finding inside a shared region is
# attributed to every variant that declares it, and the report says how many
# findings were attributed that way, so the indirection is visible rather than
# buried in a detection count.
#
# Line ranges are not stored. The loader reads them from the @ssrefuse:begin/end
# markers in the source so that editing a lab cannot silently invalidate them.

meta:
  version: 1
  guards:
    G0_none: no validation at all
    G1_denylist_substring: blocked strings searched in the raw URL text
    G2_denylist_host: parsed hostname compared against a blocklist
    G3_allowlist_prefix: URL must start with an allowlisted origin string
    G4_allowlist_substring: allowlisted host must appear somewhere in the URL
    G5_allowlist_host_redirects: exact hostname allowlist, client follows redirects
    G6_allowlist_host_noredirect: exact hostname allowlist, redirects refused
    G7_resolve_check_public: resolve, reject non-global address, then fetch by name
    G8_resolve_pin_connect: resolve, reject non-global address, connect to that address
    G9_scheme_only: scheme restricted to http/https, nothing else checked
    G10_regex_unanchored: allowlist expressed as a pattern that is not anchored at the end
    G11_guard_wrong_value: a correct check applied to a value other than the one fetched
    G12_path_concat_unvalidated: URL assembled from a fixed host and an unvalidated path
    G13_denylist_host_legacy_parser: hostname denylist applied to the output of a
      parser that does not canonicalise the authority
    G17_port_allowlist: only the ports a web service answers on are permitted
    G14_trusts_source_address: a privileged route grants access on the address the
      request arrived from
    G19_checked_at_registration: the value is validated by one request and fetched
      by another, against an answer that is not binding on the second
  entry_points:
    E0_parameter: a URL in a query string, a body field or a path segment
    E1_webhook: a URL registered now and delivered later, by a different request
    E2_discovery: a URL taken out of a document that a trusted host served
    E3_privileged_route: not an entry point at all - a route with no fetch whose
      only guard is the address the caller came from
  flows:
    F0_direct: source and sink in the same function
    F1_interprocedural: taint passes through a helper function
    F2_container: taint read out of a dict or JSON structure
    F3_assembled: URL built by interpolation, only a component is tainted
    F4_stored: taint persisted by one request and fetched by another

apps:
  flask_ssrf:
    lang: python
    file: corpus/labs/flask_ssrf/app.py
    start: ["python", "corpus/labs/flask_ssrf/app.py", "{port}"]
    ready_marker: LAB-READY
    framework: flask
  node_ssrf:
    lang: javascript
    file: corpus/labs/node_ssrf/app.js
    start: ["node", "corpus/labs/node_ssrf/app.js", "{port}"]
    ready_marker: LAB-READY
    framework: node-http

variants:
  - id: py-001
    app: flask_ssrf
    sink: requests.get
    guards: [G0_none]
    flow: F0_direct
    observability: reflected
    label: vulnerable
    entry: {method: GET, path: /preview/direct, inject: query, param: url, payload_kind: url}
    bypasses_declared: [B01_plain_loopback, B07_dns_to_internal, B15_metadata_service,
                        B16_cgnat_range, B24_internal_service_range, B25_rfc1918_host,
                        B35_self_admin]
    notes: >
      B24 and B25 are declared here because a route with no guard is where the
      reachable surface should be stated in full: not one admin endpoint but
      every port behind the loopback address and every host on the private
      network. B30 is deliberately absent and must stay absent: header-gated
      metadata is never scored as a bypass, so declaring it would be a
      permanent unreproducible declaration.

  - id: py-002
    app: flask_ssrf
    sink: requests.get
    guards: [G0_none]
    flow: F0_direct
    observability: blind
    label: vulnerable
    entry: {method: GET, path: /preview/blind, inject: query, param: url, payload_kind: url}
    bypasses_declared: [B01_plain_loopback]
    notes: >
      The response body is discarded, so only the access log and the DNS log can
      confirm a hit. B18 is not declared here because it is an instrument rather
      than a bypass; the evaluator tracks it as blind-fetch confirmation.

  - id: py-003
    app: flask_ssrf
    sink: requests.get
    guards: [G0_none]
    flow: F1_interprocedural
    observability: reflected
    label: vulnerable
    entry: {method: GET, path: /preview/helper, inject: query, param: url, payload_kind: url}
    uses_shared: [shared.fetch_remote]
    bypasses_declared: [B01_plain_loopback]

  - id: py-004
    app: flask_ssrf
    sink: requests.get
    guards: [G0_none]
    flow: F2_container
    observability: reflected
    label: vulnerable
    entry: {method: POST, path: /preview/json, inject: json, json_path: source.href, payload_kind: url}
    uses_shared: [shared.fetch_remote]
    bypasses_declared: [B01_plain_loopback]

  - id: py-005
    app: flask_ssrf
    sink: requests.get
    guards: [G12_path_concat_unvalidated]
    flow: F3_assembled
    observability: reflected
    label: vulnerable
    entry: {method: GET, path: /preview/assembled, inject: query, param: host, payload_kind: host}
    bypasses_declared: [B01_plain_loopback, B07_dns_to_internal, B10_subdomain_suffix]

  - id: py-006
    app: flask_ssrf
    sink: requests.get
    guards: [G1_denylist_substring]
    flow: F0_direct
    observability: reflected
    label: vulnerable
    entry: {method: GET, path: /preview/denylist-string, inject: query, param: url, payload_kind: url}
    bypasses_declared: [B02_loopback_alias, B03_decimal_ip, B04_octal_ip, B05_hex_ip,
                        B06_ipv6_loopback, B07_dns_to_internal, B16_cgnat_range]

  - id: py-007
    app: flask_ssrf
    sink: requests.get
    guards: [G2_denylist_host]
    flow: F0_direct
    observability: reflected
    label: vulnerable
    entry: {method: GET, path: /preview/denylist-host, inject: query, param: url, payload_kind: url}
    bypasses_declared: [B02_loopback_alias, B03_decimal_ip, B04_octal_ip, B05_hex_ip,
                        B06_ipv6_loopback, B07_dns_to_internal, B08_trailing_dot, B16_cgnat_range]

  - id: py-008
    app: flask_ssrf
    sink: requests.get
    guards: [G3_allowlist_prefix]
    flow: F0_direct
    observability: reflected
    label: vulnerable
    entry: {method: GET, path: /preview/allow-prefix, inject: query, param: url, payload_kind: url}
    bypasses_declared: [B09_userinfo_confusion, B10_subdomain_suffix]

  - id: py-009
    app: flask_ssrf
    sink: requests.get
    guards: [G4_allowlist_substring]
    flow: F0_direct
    observability: reflected
    label: vulnerable
    entry: {method: GET, path: /preview/allow-substring, inject: query, param: url, payload_kind: url}
    bypasses_declared: [B09_userinfo_confusion, B10_subdomain_suffix, B11_query_confusion,
                        B12_fragment_confusion]

  - id: py-010
    app: flask_ssrf
    sink: requests.get
    guards: [G10_regex_unanchored]
    flow: F0_direct
    observability: reflected
    label: vulnerable
    entry: {method: GET, path: /preview/allow-regex, inject: query, param: url, payload_kind: url}
    bypasses_declared: [B09_userinfo_confusion, B10_subdomain_suffix]

  - id: py-011
    app: flask_ssrf
    sink: requests.get
    guards: [G5_allowlist_host_redirects]
    flow: F0_direct
    observability: reflected
    label: vulnerable
    entry: {method: GET, path: /preview/allow-host-redirects, inject: query, param: url, payload_kind: url}
    bypasses_declared: [B13_redirect]

  - id: py-012
    app: flask_ssrf
    sink: requests.get
    guards: [G6_allowlist_host_noredirect, G9_scheme_only]
    flow: F0_direct
    observability: reflected
    label: safe
    why_safe: >
      The hostname is compared for equality after parsing and redirects are
      refused, so the only reachable host is the allowlisted partner. Reaching
      an internal target would require that name to resolve internally, which
      the testbed zone does not do.
    entry: {method: GET, path: /preview/allow-host-noredirect, inject: query, param: url, payload_kind: url}
    bypasses_declared: []

  - id: py-013
    app: flask_ssrf
    sink: requests.get
    guards: [G7_resolve_check_public, G9_scheme_only]
    flow: F0_direct
    observability: reflected
    label: vulnerable
    entry: {method: GET, path: /preview/resolve-check, inject: query, param: url, payload_kind: url}
    bypasses_declared: [B14_dns_rebinding]
    notes: the address that is validated and the address that is connected to come from two lookups

  - id: py-014
    app: flask_ssrf
    sink: requests.get
    guards: [G8_resolve_pin_connect, G9_scheme_only]
    flow: F0_direct
    observability: reflected
    label: safe
    why_safe: >
      One lookup decides both the check and the connection: the validated
      address is the address in the URL that is fetched, the hostname travels in
      the Host header, and redirects are refused. There is no second lookup to
      win and no redirect to follow. The route still fetches arbitrary *public*
      URLs, which is the feature working as intended; the label is about
      internal reach, so the out-of-band canary being reachable from here is
      expected and is not counted as a bypass.
    entry: {method: GET, path: /preview/resolve-pin, inject: query, param: url, payload_kind: url}
    bypasses_declared: []

  - id: py-015
    app: flask_ssrf
    sink: requests.get
    guards: [G9_scheme_only]
    flow: F0_direct
    observability: reflected
    label: vulnerable
    entry: {method: GET, path: /preview/scheme-only, inject: query, param: url, payload_kind: url}
    bypasses_declared: [B01_plain_loopback, B15_metadata_service,
                        B24_internal_service_range, B25_rfc1918_host]
    notes: a scheme check says nothing about which address or which port is behind it

  - id: py-024
    app: flask_ssrf
    sink: requests.get
    guards: [G17_port_allowlist, G9_scheme_only]
    flow: F0_direct
    observability: reflected
    label: vulnerable
    entry: {method: GET, path: /preview/port-allowlist, inject: query, param: url, payload_kind: url}
    bypasses_declared: [B13_redirect, B15_metadata_service, B16_cgnat_range,
                        B25_rfc1918_host]
    notes: >
      The only guard in the corpus that reasons about the port. py-015 is its
      control: same sink, same scheme check, no port check, so the difference
      between the two rows is the port allowlist and nothing else. Measured:
      24 families defeat the control and 4 defeat this, and the four are not a
      subset anyone would have guessed. Three of them reach an internal target
      on port 80, which the allowlist permits by construction -- cloud
      metadata, CGNAT space and the RFC 1918 host all answer there, and cloud
      metadata is the highest-value target in the testbed. The fourth is the
      redirect: the port is checked on the URL the application was given, and
      the client then follows that host somewhere else. A port allowlist stops
      every port-based pivot and nothing else.

  - id: py-016
    app: flask_ssrf
    sink: urllib.request.urlopen
    guards: [G0_none]
    flow: F0_direct
    observability: reflected
    label: vulnerable
    entry: {method: GET, path: /preview/urlopen, inject: query, param: url, payload_kind: url}
    bypasses_declared: [B01_plain_loopback, B17_file_scheme]
    notes: only sink in the lab that accepts non-HTTP handlers

  - id: py-017
    app: flask_ssrf
    sink: httpx.get
    guards: [G2_denylist_host]
    flow: F0_direct
    observability: reflected
    label: vulnerable
    entry: {method: GET, path: /preview/httpx, inject: query, param: url, payload_kind: url}
    bypasses_declared: [B03_decimal_ip, B07_dns_to_internal, B25_rfc1918_host,
                        B27_unicode_authority]
    notes: >
      Same guard as py-007 behind a different client library, and B27 is where
      that stops being a formality: requests refuses an authority written with
      ideographic full stops, httpx sends it, and the address it resolves to is
      loopback. The guard is identical in both routes.

  - id: py-018
    app: flask_ssrf
    sink: subprocess.run+curl
    guards: [G0_none]
    flow: F0_direct
    observability: reflected
    label: vulnerable
    entry: {method: GET, path: /preview/curl, inject: query, param: url, payload_kind: url}
    bypasses_declared: [B01_plain_loopback, B22_gopher_scheme, B23_dict_scheme,
                        B24_internal_service_range, B25_rfc1918_host,
                        B27_unicode_authority]
    notes: >
      The fetch leaves the process entirely, so library-level rules see nothing
      and the protocol surface is curl's rather than the language's. B22 and
      B23 are declared only here and on js-018: gopher and dict are what turn
      an SSRF into writes against Redis in production, and no library sink in
      either lab speaks them.

  - id: py-019
    app: flask_ssrf
    sink: none
    guards: []
    flow: F4_stored
    observability: reflected
    label: safe
    why_safe: >
      This route only writes the URL into module state. No request-sending call
      is reachable from it, so a finding anchored here is a false positive even
      though the value it stores is later fetched by py-020.
    entry: {method: POST, path: /preview/enqueue, inject: json, json_path: url, payload_kind: url}
    bypasses_declared: []
    no_sink: true

  - id: py-020
    app: flask_ssrf
    sink: requests.get
    guards: [G0_none]
    flow: F4_stored
    observability: reflected
    label: vulnerable
    entry:
      steps:
        - {method: POST, path: /preview/enqueue, inject: json, json_path: url, payload_kind: url,
           capture: {job_id: job_id}}
        - {method: GET, path: "/preview/run/{job_id}"}
    bypasses_declared: [B01_plain_loopback]
    notes: second-order flow; nothing tainted appears inside the sink function

  - id: py-021
    app: flask_ssrf
    sink: requests.get
    guards: [G11_guard_wrong_value]
    flow: F0_direct
    observability: reflected
    label: vulnerable
    entry: {method: GET, path: /preview/checked-wrong-value, inject: query, param: url, payload_kind: url}
    bypasses_declared: [B21_decoded_delimiter]
    notes: >
      The check parses a decoded copy and the fetch uses the raw value. Any
      payload whose escaped form has the allowlisted hostname but whose raw form
      does not resolve there gets through.

  - id: py-022
    app: flask_ssrf
    sink: requests.get
    guards: []
    flow: F0_direct
    observability: reflected
    label: safe
    why_safe: >
      The URL is a module constant. No request parameter, header or body field
      reaches this call, so there is no attacker-controlled input at all.
    entry: {method: GET, path: /status/upstream, inject: none, payload_kind: none}
    bypasses_declared: []
    no_user_input: true

  - id: py-023
    app: flask_ssrf
    sink: requests.get
    guards: [G12_path_concat_unvalidated]
    flow: F3_assembled
    observability: reflected
    label: safe
    why_safe: >
      Only the path is attacker-controlled and the validation rejects every
      character that could end the path component and take over the authority,
      which the B09 and B20 path payloads exercise directly.
    entry: {method: GET, path: /preview/path-only, inject: query, param: path, payload_kind: path}
    bypasses_declared: []


  - id: py-025
    app: flask_ssrf
    sink: none
    guards: [G19_checked_at_registration]
    flow: F4_stored
    observability: reflected
    label: safe
    why_safe: >
      Registration validates the host and sends no request of its own. The
      route is a false-positive control: a detector that reports it is
      reporting the half of the feature that is correct. What the value is
      used for later is py-026.
    entry: {method: POST, path: /webhooks, inject: json, json_path: url, payload_kind: url}
    bypasses_declared: []
    no_sink: true
    entry_point: E1_webhook

  - id: py-026
    app: flask_ssrf
    sink: requests.get
    guards: []
    flow: F4_stored
    observability: reflected
    label: vulnerable
    entry:
      steps:
        - {method: POST, path: /webhooks, inject: json, json_path: url, payload_kind: url,
           capture: {hook_id: hook_id}}
        - {method: POST, path: "/webhooks/{hook_id}/deliver"}
    bypasses_declared: [B13_redirect]
    entry_point: E1_webhook
    notes: >
      The webhook shape, which is the most common entry point in real SSRF
      reports and is not the same as py-019/py-020: there the value was never
      checked, here it was checked and the check does not bind the request
      that uses it. Only a payload that passes the registration allowlist can
      reach this at all. Measured, and not what was predicted: an
      exact-hostname allowlist at registration does constrain DNS rebinding,
      because the rebinding name is not the allowlisted one and so never gets
      stored. The one family that survives is the redirect. That is a
      narrower hole than expected, and it is the measurement, so it is what
      is declared.

  - id: py-027
    app: flask_ssrf
    sink: requests.get
    guards: [G6_allowlist_host_noredirect]
    flow: F1_interprocedural
    observability: reflected
    label: vulnerable
    entry: {method: POST, path: /sso/configure, inject: json, json_path: issuer, payload_kind: url}
    bypasses_declared: [B13_redirect, B34_discovery_document_pivot]
    entry_point: E2_discovery
    notes: >
      Two fetches. The first is allowlisted and the second is not, because the
      second URL comes out of the first response rather than out of the
      request. Every discovery feature has this shape - OIDC, SAML, oEmbed,
      Open Graph - and a guard that validates user input cannot see the hop
      that matters.

  - id: py-028
    app: flask_ssrf
    sink: none
    guards: [G14_trusts_source_address]
    flow: F0_direct
    observability: reflected
    label: safe
    why_safe: >
      This route sends no request, so it cannot be an SSRF sink and a
      detector that reports it is wrong. It is in the corpus as the *target*
      of one: its only guard is the address the caller came from, and the
      B35 family measures what happens when the application fetches it
      itself. The harness also runs the other half of that pair on every
      probe - the same route reached from 10.0.0.10, which must be
      refused - because a reachable admin route that was never protected
      would make B35 look like a bypass when it is not.
    entry: {method: GET, path: /internal/admin, inject: none, payload_kind: none}
    bypasses_declared: []
    no_sink: true
    entry_point: E3_privileged_route

  # --- JavaScript lab ------------------------------------------------------
  # Same guard taxonomy as the Python lab so the two can be compared row by
  # row. Where a row differs, the runtime is the reason and the note says
  # which runtime fact it is. Three of them drive most of the difference and
  # each was measured, not assumed: new URL() canonicalises numeric and
  # percent-encoded authorities, fetch() refuses a URL carrying credentials,
  # and fetch() follows redirects while http.get() never does.

  - id: js-001
    app: node_ssrf
    sink: fetch
    guards: [G0_none]
    flow: F0_direct
    observability: reflected
    label: vulnerable
    entry: {method: GET, path: /preview/direct, inject: query, param: url, payload_kind: url}
    bypasses_declared: [B01_plain_loopback, B07_dns_to_internal, B15_metadata_service,
                        B16_cgnat_range, B24_internal_service_range, B25_rfc1918_host,
                        B27_unicode_authority, B35_self_admin]
    notes: >
      B27 is declared on the JavaScript side and not on the Python one. Both
      runtimes resolve an ideographic-full-stop authority to loopback, but
      requests rejects the URL before sending it, so on py-001 the cell is a
      sink error. py-017 (httpx) and py-018 (curl) are where the same payload
      reaches an internal target in Python.

  - id: js-002
    app: node_ssrf
    sink: fetch
    guards: [G0_none]
    flow: F0_direct
    observability: blind
    label: vulnerable
    entry: {method: GET, path: /preview/blind, inject: query, param: url, payload_kind: url}
    bypasses_declared: [B01_plain_loopback]
    notes: >
      The response body is discarded, so only the access log and the DNS log
      can confirm a hit.

  - id: js-003
    app: node_ssrf
    sink: fetch
    guards: [G0_none]
    flow: F1_interprocedural
    observability: reflected
    label: vulnerable
    entry: {method: GET, path: /preview/helper, inject: query, param: url, payload_kind: url}
    uses_shared: [shared.fetchRemote]
    bypasses_declared: [B01_plain_loopback]

  - id: js-004
    app: node_ssrf
    sink: fetch
    guards: [G0_none]
    flow: F2_container
    observability: reflected
    label: vulnerable
    entry: {method: POST, path: /preview/json, inject: json, json_path: source.href, payload_kind: url}
    uses_shared: [shared.fetchRemote]
    bypasses_declared: [B01_plain_loopback]

  - id: js-005
    app: node_ssrf
    sink: http.get
    guards: [G12_path_concat_unvalidated]
    flow: F3_assembled
    observability: reflected
    label: vulnerable
    entry: {method: GET, path: /preview/assembled, inject: query, param: host, payload_kind: host}
    bypasses_declared: [B01_plain_loopback, B07_dns_to_internal, B10_subdomain_suffix]

  - id: js-006
    app: node_ssrf
    sink: fetch
    guards: [G1_denylist_substring]
    flow: F0_direct
    observability: reflected
    label: vulnerable
    entry: {method: GET, path: /preview/denylist-string, inject: query, param: url, payload_kind: url}
    bypasses_declared: [B02_loopback_alias, B03_decimal_ip, B04_octal_ip, B05_hex_ip,
                        B06_ipv6_loopback, B07_dns_to_internal, B16_cgnat_range,
                        B19_encoded_host, B25_rfc1918_host, B27_unicode_authority]
    notes: >
      B19 is declared here and not on the Python substring denylist, which is
      the point of having both: the guard reads the raw text either way, and in
      Node the sink decodes the percent-encoded authority back to the address
      the denylist was written for.

  - id: js-007
    app: node_ssrf
    sink: fetch
    guards: [G13_denylist_host_legacy_parser]
    flow: F0_direct
    observability: reflected
    label: vulnerable
    entry: {method: GET, path: /preview/denylist-host-legacy, inject: query, param: url, payload_kind: url}
    bypasses_declared: [B02_loopback_alias, B03_decimal_ip, B04_octal_ip, B05_hex_ip,
                        B06_ipv6_loopback, B07_dns_to_internal, B08_trailing_dot,
                        B16_cgnat_range, B19_encoded_host, B25_rfc1918_host,
                        B27_unicode_authority, B28_slash_confusion]
    notes: >
      Pairs with js-008: identical denylist, identical sink, different parser.
      The legacy parser returns the authority as written, so the comparison is
      against a string the attacker chose the spelling of.

  - id: js-008
    app: node_ssrf
    sink: fetch
    guards: [G2_denylist_host]
    flow: F0_direct
    observability: reflected
    label: vulnerable
    entry: {method: GET, path: /preview/denylist-host, inject: query, param: url, payload_kind: url}
    bypasses_declared: [B06_ipv6_loopback, B07_dns_to_internal, B08_trailing_dot,
                        B16_cgnat_range, B25_rfc1918_host]
    notes: >
      The WHATWG parser canonicalises the authority before the comparison, so
      the numeric-spelling families collapse onto a denylist entry and stop
      working. What is left is everything a denylist cannot know about: a name,
      a trailing dot, a bracketed IPv6 literal, and an address range nobody
      wrote down. Same guard class as py-007, far fewer columns.

  - id: js-009
    app: node_ssrf
    sink: http.get
    guards: [G3_allowlist_prefix]
    flow: F0_direct
    observability: reflected
    label: vulnerable
    entry: {method: GET, path: /preview/allow-prefix, inject: query, param: url, payload_kind: url}
    bypasses_declared: [B09_userinfo_confusion, B10_subdomain_suffix]
    notes: >
      Uses http.get deliberately. The same guard in front of fetch loses the
      userinfo family, because fetch refuses a URL carrying credentials, and
      js-010 is there to show that half of the pair.

  - id: js-010
    app: node_ssrf
    sink: fetch
    guards: [G4_allowlist_substring]
    flow: F0_direct
    observability: reflected
    label: vulnerable
    entry: {method: GET, path: /preview/allow-substring, inject: query, param: url, payload_kind: url}
    bypasses_declared: [B10_subdomain_suffix, B11_query_confusion, B12_fragment_confusion]
    notes: >
      B09 is not declared although the guard does not stop it: fetch rejects
      the URL before a request is sent. The cell is a sink_error, not a block,
      and the matrix keeps those apart.

  - id: js-011
    app: node_ssrf
    sink: fetch
    guards: [G10_regex_unanchored]
    flow: F0_direct
    observability: reflected
    label: vulnerable
    entry: {method: GET, path: /preview/allow-regex, inject: query, param: url, payload_kind: url}
    bypasses_declared: [B10_subdomain_suffix]

  - id: js-012
    app: node_ssrf
    sink: fetch
    guards: [G5_allowlist_host_redirects]
    flow: F0_direct
    observability: reflected
    label: vulnerable
    entry: {method: GET, path: /preview/allow-host-redirects, inject: query, param: url, payload_kind: url}
    bypasses_declared: [B13_redirect]
    notes: following redirects is the default in fetch, so this variant is what an app gets by writing nothing

  - id: js-013
    app: node_ssrf
    sink: fetch
    guards: [G6_allowlist_host_noredirect, G9_scheme_only]
    flow: F0_direct
    observability: reflected
    label: safe
    why_safe: >
      The hostname is compared for equality after WHATWG parsing and redirects
      are refused with redirect:'manual', so the only reachable host is the
      allowlisted partner. Reaching an internal target would require that name
      to resolve internally, which the testbed zone does not do.
    entry: {method: GET, path: /preview/allow-host-noredirect, inject: query, param: url, payload_kind: url}
    bypasses_declared: []

  - id: js-014
    app: node_ssrf
    sink: fetch
    guards: [G7_resolve_check_public, G9_scheme_only]
    flow: F0_direct
    observability: reflected
    label: vulnerable
    entry: {method: GET, path: /preview/resolve-check, inject: query, param: url, payload_kind: url}
    bypasses_declared: [B14_dns_rebinding]
    notes: dns.lookup decides the check, undici resolves again for the connection

  - id: js-015
    app: node_ssrf
    sink: http.get
    guards: [G8_resolve_pin_connect, G9_scheme_only]
    flow: F0_direct
    observability: reflected
    label: safe
    why_safe: >
      One lookup decides both the check and the connection: the validated
      address is handed to the socket as a lookup function that can return
      nothing else, the hostname still travels in the Host header, and http.get
      does not follow redirects. There is no second lookup to win. The route
      still fetches arbitrary public URLs, which is the feature working as
      intended; the label is about internal reach, so reaching the out-of-band
      canary from here is expected and is not counted as a bypass.
    entry: {method: GET, path: /preview/resolve-pin, inject: query, param: url, payload_kind: url}
    bypasses_declared: []

  - id: js-016
    app: node_ssrf
    sink: fetch
    guards: [G9_scheme_only]
    flow: F0_direct
    observability: reflected
    label: vulnerable
    entry: {method: GET, path: /preview/scheme-only, inject: query, param: url, payload_kind: url}
    bypasses_declared: [B01_plain_loopback, B15_metadata_service,
                        B24_internal_service_range, B25_rfc1918_host,
                        B27_unicode_authority]
    notes: a scheme check says nothing about which address or which port is behind it

  - id: js-024
    app: node_ssrf
    sink: fetch
    guards: [G17_port_allowlist, G9_scheme_only]
    flow: F0_direct
    observability: reflected
    label: vulnerable
    entry: {method: GET, path: /preview/port-allowlist, inject: query, param: url, payload_kind: url}
    bypasses_declared: [B13_redirect, B15_metadata_service, B16_cgnat_range,
                        B25_rfc1918_host]
    notes: >
      Pairs with py-024 across runtimes and with js-016 within this one:
      js-016 is the same sink and the same scheme check without the port
      check. Measured: the surviving four are identical to the Python side,
      which is worth more than either row alone -- the runtime differences
      that separate the two labs everywhere else do not touch this guard,
      because what defeats it is a property of the targets and of redirects
      rather than of URL parsing.

  - id: js-017
    app: node_ssrf
    sink: http.get
    guards: [G0_none]
    flow: F0_direct
    observability: reflected
    label: vulnerable
    entry: {method: GET, path: /preview/httpget, inject: query, param: url, payload_kind: url}
    bypasses_declared: [B01_plain_loopback, B09_userinfo_confusion]
    notes: >
      The sink that accepts credentials in the URL. B17 is not declared: unlike
      urllib in the Python lab, neither http.get nor fetch has a file handler,
      so a negative there is about the sink and not about a guard.

  - id: js-018
    app: node_ssrf
    sink: execFile+curl
    guards: [G0_none]
    flow: F0_direct
    observability: reflected
    label: vulnerable
    entry: {method: GET, path: /preview/curl, inject: query, param: url, payload_kind: url}
    bypasses_declared: [B01_plain_loopback, B22_gopher_scheme, B23_dict_scheme,
                        B24_internal_service_range, B25_rfc1918_host,
                        B27_unicode_authority]
    notes: >
      The fetch leaves the process entirely, so library-level rules see nothing
      and the protocol surface is curl's rather than the language's.

  - id: js-019
    app: node_ssrf
    sink: none
    guards: []
    flow: F4_stored
    observability: reflected
    label: safe
    why_safe: >
      This route only writes the URL into module state. No request-sending call
      is reachable from it, so a finding anchored here is a false positive even
      though the value it stores is later fetched by js-020.
    entry: {method: POST, path: /preview/enqueue, inject: json, json_path: url, payload_kind: url}
    bypasses_declared: []
    no_sink: true

  - id: js-020
    app: node_ssrf
    sink: fetch
    guards: [G0_none]
    flow: F4_stored
    observability: reflected
    label: vulnerable
    entry:
      steps:
        - {method: POST, path: /preview/enqueue, inject: json, json_path: url, payload_kind: url,
           capture: {job_id: job_id}}
        - {method: GET, path: "/preview/run/{job_id}"}
    bypasses_declared: [B01_plain_loopback]
    notes: second-order flow; nothing tainted appears inside the sink function

  - id: js-021
    app: node_ssrf
    sink: http.get
    guards: [G11_guard_wrong_value]
    flow: F0_direct
    observability: reflected
    label: vulnerable
    entry: {method: GET, path: /preview/checked-wrong-value, inject: query, param: url, payload_kind: url}
    bypasses_declared: [B21_decoded_delimiter]
    notes: >
      The check parses a decoded copy and the fetch uses the raw value. The sink
      is http.get because the payload carries credentials and fetch would refuse
      it before the guard's mistake could matter.

  - id: js-022
    app: node_ssrf
    sink: fetch
    guards: []
    flow: F0_direct
    observability: reflected
    label: safe
    why_safe: >
      The URL is a module constant. No request parameter, header or body field
      reaches this call, so there is no attacker-controlled input at all.
    entry: {method: GET, path: /status/upstream, inject: none, payload_kind: none}
    bypasses_declared: []
    no_user_input: true

  - id: js-023
    app: node_ssrf
    sink: http.get
    guards: [G12_path_concat_unvalidated]
    flow: F3_assembled
    observability: reflected
    label: safe
    why_safe: >
      Only the path is attacker-controlled and the validation rejects every
      character that could end the path component and take over the authority.
      The sink is http.get, which does accept a URL carrying credentials, so
      the B09 and B20 path payloads are stopped by the guard and not by the
      client refusing to send them.
    entry: {method: GET, path: /preview/path-only, inject: query, param: path, payload_kind: path}
    bypasses_declared: []

  - id: js-025
    app: node_ssrf
    sink: none
    guards: [G19_checked_at_registration]
    flow: F4_stored
    observability: reflected
    label: safe
    why_safe: >
      Registration validates the host and sends no request of its own. The
      route is a false-positive control: a detector that reports it is
      reporting the half of the feature that is correct. What the value is
      used for later is js-026.
    entry: {method: POST, path: /webhooks, inject: json, json_path: url, payload_kind: url}
    bypasses_declared: []
    no_sink: true
    entry_point: E1_webhook

  - id: js-026
    app: node_ssrf
    sink: fetch
    guards: []
    flow: F4_stored
    observability: reflected
    label: vulnerable
    entry:
      steps:
        - {method: POST, path: /webhooks, inject: json, json_path: url, payload_kind: url,
           capture: {hook_id: hook_id}}
        - {method: POST, path: "/webhooks/{hook_id}/deliver"}
    bypasses_declared: [B13_redirect]
    entry_point: E1_webhook
    notes: >
      The webhook shape, which is the most common entry point in real SSRF
      reports and is not the same as js-019/js-020: there the value was never
      checked, here it was checked and the check does not bind the request
      that uses it. Only a payload that passes the registration allowlist can
      reach this at all. Measured, and not what was predicted: an
      exact-hostname allowlist at registration does constrain DNS rebinding,
      because the rebinding name is not the allowlisted one and so never gets
      stored. The one family that survives is the redirect. That is a
      narrower hole than expected, and it is the measurement, so it is what
      is declared.

  - id: js-027
    app: node_ssrf
    sink: fetch
    guards: [G6_allowlist_host_noredirect]
    flow: F1_interprocedural
    observability: reflected
    label: vulnerable
    entry: {method: POST, path: /sso/configure, inject: json, json_path: issuer, payload_kind: url}
    bypasses_declared: [B13_redirect, B34_discovery_document_pivot]
    entry_point: E2_discovery
    notes: >
      Two fetches. The first is allowlisted and the second is not, because the
      second URL comes out of the first response rather than out of the
      request. Every discovery feature has this shape - OIDC, SAML, oEmbed,
      Open Graph - and a guard that validates user input cannot see the hop
      that matters.

  - id: js-028
    app: node_ssrf
    sink: none
    guards: [G14_trusts_source_address]
    flow: F0_direct
    observability: reflected
    label: safe
    why_safe: >
      This route sends no request, so it cannot be an SSRF sink and a
      detector that reports it is wrong. It is in the corpus as the *target*
      of one: its only guard is the address the caller came from, and the
      B35 family measures what happens when the application fetches it
      itself. The harness also runs the other half of that pair on every
      probe - the same route reached from 10.0.0.10, which must be
      refused - because a reachable admin route that was never protected
      would make B35 look like a bypass when it is not.
    entry: {method: GET, path: /internal/admin, inject: none, payload_kind: none}
    bypasses_declared: []
    no_sink: true
    entry_point: E3_privileged_route
