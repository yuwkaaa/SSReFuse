[project]
name = "ssrefuse"
version = "0.1.0"
description = "SSReFuse - fusing static taint analysis with LLM reasoning to detect SSRF"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
    "jinja2>=3.1",
    "dnslib>=0.9",
    "flask>=3.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
static = ["semgrep>=1.80"]
dev = ["pytest>=8.0"]

[project.scripts]
ssrefuse = "ssrefuse.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ssrefuse*"]
