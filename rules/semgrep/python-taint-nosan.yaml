# Interprocedural taint from a request parameter to an outbound request sink,
# with no sanitizer declared. Everything the application does to validate the URL
# is invisible to this configuration on purpose: it isolates how much of the
# result comes from reachability alone, before any claim about guards.
rules:
  - id: ssrefuse-py-taint-nosan
    mode: taint
    languages: [python]
    severity: WARNING
    message: >-
      A request-controlled value reaches an outbound request sink. No validation
      is modelled by this configuration.
    metadata:
      ssrefuse-detector: taint-nosan
      ssrefuse-lang: python
    pattern-sources:
      - pattern: flask.request.args.get(...)
      - pattern: request.args.get(...)
      - pattern: request.args[...]
      - pattern: request.form.get(...)
      - pattern: request.values.get(...)
      - pattern: request.get_json(...)
      - pattern: request.json
      - pattern: request.headers.get(...)
      - pattern: request.cookies.get(...)
      - pattern: request.data
    pattern-sinks:
      # Clients addressed by method name. The method-name constraint lives in a
      # block of its own: placed beside a pattern-either it would discard the
      # alternatives that do not bind $M.
      - patterns:
          - pattern-either:
              - pattern: requests.$M($URL, ...)
              - pattern: httpx.$M($URL, ...)
          - focus-metavariable: $URL
          - metavariable-regex:
              metavariable: $M
              regex: ^(get|post|put|patch|delete|head|options|request)$
      - patterns:
          - pattern-either:
              - pattern: urllib.request.urlopen($URL, ...)
              - pattern: urlopen($URL, ...)
          - focus-metavariable: $URL
      - patterns:
          - pattern: subprocess.$F([..., $URL], ...)
          - focus-metavariable: $URL
